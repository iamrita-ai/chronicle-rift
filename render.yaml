services:
  - type: web
    name: chronicle-rift
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn chronicle_rift.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: BOT_MODE
        value: webhook
      - key: RICH_MESSAGES_ENABLED
        value: "true"
      - key: MONGODB_DATABASE
        value: chronicle_rift
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
