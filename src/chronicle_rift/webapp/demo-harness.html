<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ChronicleRift — demo harness</title>
  <style>
    html, body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
    .arena-fx-host { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="arena-canvas"></canvas>
  <div id="arena-fx-host" class="arena-fx-host"></div>
  <script src="./vendor/three.min.js"></script>
  <script src="./arena.js"></script>
  <script>
    /* Dev-only harness: drives the arena engine through a scripted duel so
     * contributors can preview fighters and record demo footage without a
     * Telegram backend. Not referenced by the game itself.
     *
     * Two modes:
     *  - auto (default): the normal requestAnimationFrame loop, for humans.
     *  - manual: window.__step(n) advances the simulation deterministically
     *    and returns a PNG frame — used by tools/capture_demo.py so footage
     *    always runs at true game speed even on slow software renderers.
     */
    const canvas = document.getElementById("arena-canvas");
    const arena = new window.ChronicleArena.Arena({
      canvas,
      onEnd: (outcome) => { window.__ended = outcome; },
      onHud: () => {},
    });
    arena.resize(960, 540);
    window.__arena = arena;
    window.__errors = [];
    window.addEventListener("error", (e) => window.__errors.push(String(e.message)));

    const hero = (element, name) => ({
      name, element, build: "hero", scale: 1, artFacing: 1,
      stats: { hp: 520, damage: 26, speed: 242, atkSpeed: 1.15, range: 106, crit: 0.16, defense: 26 },
    });
    const foe = (name, element, build, scale) => ({
      name, element, build, scale, artFacing: -1,
      stats: { hp: 560, damage: 21, speed: 192, atkSpeed: 0.95, range: 112, crit: 0.08, defense: 20 },
    });
    const sceneFor = (el) => ({ fire: "bg-ember", ice: "bg-frost", arcane: "bg-arcane", shadow: "bg-void", wind: "bg-arcane" }[el] || "bg-ember");
    const heroName = (el) => ({ fire: "Emberblade", ice: "Frostward", wind: "Stormcaller", arcane: "Rift Reader", shadow: "Voidreaper" }[el] || "Riftwalker");

    window.__setup = (heroEl, foeName, foeEl, foeBuild, foeScale) => {
      arena.setScene(sceneFor(foeEl));
      arena.setFighters(hero(heroEl, heroName(heroEl)), foe(foeName, foeEl, foeBuild, foeScale));
      arena.draw();
    };
    window.__setup("fire", "Rift Stalker", "shadow", "beast", 1.22);

    // scripted, cinematic input
    let t = 0;
    const script = (dt) => {
      t += dt;
      const p = arena.player;
      if (!p || arena.over) { arena.input.dx = 0; return; }
      const e = arena.enemy;
      const dist = Math.abs(e.x - p.x);
      arena.input.dx = dist > 160 ? Math.sign(e.x - p.x) * 0.95 : (Math.sin(t * 1.6) > 0 ? 0.45 : -0.45);
      if (Math.sin(t * 5.4) > 0.9) arena.input.attack = true;
      if (Math.sin(t * 2.2) > 0.94) arena.input.abilities[1 + (Math.floor(Math.abs(Math.sin(t * 3.1) * 2)) % 2)] = true;
      if (Math.sin(t * 1.3) > 0.985) arena.input.abilities[0] = true;
    };

    /* ---- auto mode ---- */
    const origUpdate = arena.update.bind(arena);
    arena.update = (dt) => { script(dt); origUpdate(dt); };
    arena.start();

    /* ---- manual mode for deterministic recording ---- */
    window.__pause = () => arena.stop();
    window.__resume = () => arena.start();
    window.__step = (n, dt) => {
      arena.stop();
      for (let i = 0; i < n; i += 1) arena.update(dt || 1 / 60);
      arena.r.render(1 / 30);
      return canvas.toDataURL("image/png");
    };
  </script>
</body>
</html>
